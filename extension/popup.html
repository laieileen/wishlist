<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save to Keepsake</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            color-scheme: light;
            --ink: #252d27;
            --muted: #777d73;
            --line: #e5e4da;
            --paper: #f7f6f0;
            --leaf: #315b45;
            --leaf-wash: #e8eee5;
            --clay: #c8795d;
        }

        body {
            width: 360px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--ink);
            background-color: var(--paper);
            background-image: linear-gradient(rgba(49, 91, 69, 0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(49, 91, 69, 0.025) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .container {
            padding: 23px 22px 20px;
        }

        .topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 23px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--line);
        }

        .wordmark {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 14px;
            font-weight: 650;
        }

        .brand-mark {
            display: grid;
            width: 27px;
            aspect-ratio: 1;
            place-items: center;
            border-radius: 50% 50% 50% 4px;
            color: white;
            background: var(--leaf);
            font: 15px Georgia, serif;
        }

        .eyebrow {
            color: var(--muted);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1.1px;
        }

        h1 {
            margin: 0 0 5px;
            font: 400 27px Georgia, 'Times New Roman', serif;
        }

        .subtitle {
            margin-bottom: 19px;
            color: var(--muted);
            font-size: 12px;
        }

        .form-group {
            margin-bottom: 13px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #626b61;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        input {
            width: 100%;
            min-height: 40px;
            padding: 9px 11px;
            border: 1px solid #d9d9ce;
            border-radius: 3px;
            font-size: 14px;
            font-family: inherit;
            color: var(--ink);
            background: rgba(255, 254, 250, 0.8);
        }

        input:focus {
            outline: 2px solid var(--leaf);
            outline-offset: 1px;
        }

        input::placeholder {
            color: #a2a49a;
        }

        #title {
            color: #686e64;
            font-size: 12px;
        }

        .source {
            display: block;
            max-width: 100%;
            overflow: hidden;
            margin-top: 6px;
            color: var(--leaf);
            font-size: 11px;
            text-decoration: none;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .category-input-wrapper {
            position: relative;
        }

        .category-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fffefa;
            border: 1px solid var(--line);
            border-top: none;
            border-radius: 0 0 3px 3px;
            max-height: 150px;
            overflow-y: auto;
            display: none;
            z-index: 10;
        }

        .category-suggestions.show {
            display: block;
        }

        .suggestion-item {
            padding: 10px 11px;
            cursor: pointer;
            border-bottom: 1px solid #f0efe8;
            font-size: 12px;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background: var(--leaf-wash);
        }

        .suggestion-item.preset {
            color: var(--ink);
        }

        .suggestion-item.create-new {
            color: var(--leaf);
            font-weight: 600;
            background: #f5f7f1;
        }

        button {
            width: 100%;
            min-height: 43px;
            padding: 11px 14px;
            background: var(--leaf);
            color: white;
            border: none;
            border-radius: 3px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 150ms ease;
            margin-top: 5px;
        }

        button:hover:not(:disabled) {
            background: #254735;
        }

        button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .secondary-button {
            min-height: 32px;
            width: auto;
            margin: 0;
            padding: 6px 0 6px 10px;
            color: var(--leaf);
            background: transparent;
            font-size: 11px;
        }

        .secondary-button:hover:not(:disabled) {
            color: #254735;
            background: transparent;
        }

        .signed-in-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 21px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--line);
            color: var(--muted);
            font-size: 11px;
        }

        .signed-in-email {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .auth-note {
            margin: 0 0 16px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }

        .text-button {
            display: block;
            width: auto;
            min-height: 30px;
            margin: 6px 0 12px auto;
            padding: 4px 0 4px 8px;
            color: var(--leaf);
            background: transparent;
            font-size: 11px;
            font-weight: 500;
        }

        .text-button:hover:not(:disabled) {
            color: #254735;
            background: transparent;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        #auth-status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 3px;
            font-size: 12px;
            line-height: 1.4;
            display: none;
        }

        #auth-status.success {
            display: block;
            color: #264835;
            background: var(--leaf-wash);
        }

        #auth-status.error {
            display: block;
            color: #803d32;
            background: #f7eae5;
        }

        [hidden] {
            display: none !important;
        }

        #status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 3px;
            font-size: 12px;
            line-height: 1.4;
            text-align: left;
            font-weight: 500;
            display: none;
        }

        #status.success {
            background: var(--leaf-wash);
            color: #264835;
            display: block;
        }

        #status.error {
            background: #f7eae5;
            color: #803d32;
            display: block;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="topline">
            <span class="wordmark"><span class="brand-mark">W</span> keepsake</span>
            <span class="eyebrow">QUICK SAVE</span>
        </div>
        <section id="auth-panel" aria-labelledby="auth-title">
            <h1 id="auth-title">Sign in to save.</h1>
            <p class="subtitle">Use your Keepsake account to reach your collection.</p>
            <form id="auth-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input id="login-email" type="email" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input id="login-password" type="password" autocomplete="current-password" required>
                </div>
                <button id="auth-submit" type="submit">Sign in</button>
                <button id="forgot-password" class="text-button" type="button">Forgot password?</button>
                <p class="auth-note">Create your account on the Keepsake website first.</p>
                <p id="auth-status" role="status" aria-live="polite"></p>
            </form>
        </section>
        <section id="save-panel" hidden aria-labelledby="save-title">
            <div class="signed-in-bar">
                <span class="signed-in-email" id="signed-in-email"></span>
                <button class="secondary-button" id="sign-out" type="button">Sign out</button>
            </div>
            <h1 id="save-title">Keep it in mind.</h1>
            <p class="subtitle">Add this find to your wishlist.</p>
            <form id="save-form">
                <div class="form-group">
                    <label for="title">Item title</label>
                    <input id="title" type="text" placeholder="Auto-filled from page" readonly>
                    <a class="source" id="source" target="_blank" rel="noopener noreferrer"></a>
                </div>
                <div class="form-group">
                    <label for="price">Price</label>
                    <input id="price" type="number" placeholder="0.00" step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <div class="category-input-wrapper">
                        <input id="category" type="text" placeholder="Choose or create one" autocomplete="off" required
                            maxlength="40">
                        <div class="category-suggestions" id="suggestions"></div>
                    </div>
                </div>
                <button id="submit" type="submit">Save to wishlist</button>
                <p id="status" role="status" aria-live="polite"></p>
            </form>
        </section>
    </div>

    <script src="popup.js"></script>
</body>

</html>
